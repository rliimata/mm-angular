<div class="shell">
  <header class="top">
    <a routerLink="/" class="brand">
      <span class="logo" aria-hidden="true">mm</span>
      <span class="brand-name">Movie Manager</span>
    </a>
    <div class="top-center">
      @if (auth.isLoggedIn() && auth.isSuperUser()) {
        <nav class="top-actions desktop-only">
          <a routerLink="/movie/new" class="top-btn">Uusi elokuva</a>
        </nav>
      }
    </div>
    <div class="top-right">
      @if (auth.isLoggedIn()) {
        <div class="user">
          <span>{{ auth.displayName() }}</span>
          @if (auth.isSuperUser()) {
            <span class="badge">admin</span>
          }
          <button
            type="button"
            class="logout-btn"
            (click)="logout()"
            title="Kirjaudu ulos"
            aria-label="Kirjaudu ulos"
          ></button>
        </div>
      }
    </div>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
<app-list-preview />
