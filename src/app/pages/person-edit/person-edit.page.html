<section
  class="edit-page"
  [class.gender-male]="gender === 0"
  [class.gender-female]="gender === 1"
>
  <div class="edit-layout">
    <app-media-image
      kind="person"
      [entityId]="id"
      [alt]="pf?.name || initialName"
      [editable]="true"
      [imageSearchQuery]="personImageSearchQuery(pf?.name || initialName)"
    />
    <div class="edit-main">
      <header class="edit-head">
        <h1>{{ id ? 'Muokkaa henkilöä' : 'Uusi henkilö' }}</h1>
        <div class="head-actions">
          <button type="button" class="primary" (click)="pf.save()" [disabled]="pf.saving() || !pf.canSave()">
            Tallenna
          </button>
          <button type="button" class="ghost cancel-btn" (click)="close()">Peruuta</button>
        </div>
      </header>
      <div class="edit-body">
        <app-person-form
          #pf
          [personId]="id"
          [initialName]="initialName"
          [showCancel]="false"
          [showFooter]="false"
          (saved)="onSaved($event)"
          (genderChange)="gender = $event"
        />
      </div>
    </div>
  </div>
</section>
