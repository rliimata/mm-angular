@if (open) {
  <div class="modal-backdrop nested" (click)="closed.emit()">
    <div class="modal modal-small" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h2>{{ title }}</h2>
      </header>
      <div class="modal-body">
        <label class="block">
          Arvo
          <input
            [ngModel]="value"
            (ngModelChange)="onValue($event)"
            name="catalogAddValue"
            (keydown.enter)="$event.preventDefault(); save.emit()"
            autofocus
          />
        </label>
        @if (error) {
          <p class="error">{{ error }}</p>
        }
      </div>
      <footer class="modal-foot">
        <button type="button" class="primary" (click)="save.emit()" [disabled]="saving">Tallenna</button>
        <button type="button" class="ghost" (click)="closed.emit()" [disabled]="saving">Peruuta</button>
      </footer>
    </div>
  </div>
}
